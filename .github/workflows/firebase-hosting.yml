name: CI/CD - Firebase Hosting

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure production API URL
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          node -e 'const fs = require("node:fs"); fs.writeFileSync("src/environments/environment.production.ts", `export const environment = { apiUrl: ${JSON.stringify(process.env.API_URL)}, csrfEnabled: true };\n`);'

      - name: Build Angular application
        run: npm run build

      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ESIBUY }}
          projectId: esibuy

      - name: Deploy live site
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ESIBUY }}
          projectId: esibuy
          channelId: live
