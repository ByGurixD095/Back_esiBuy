services:
  - type: web
    name: esibuy-api
    runtime: docker
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "1200000"
      - key: JWT_REFRESH_EXPIRATION
        value: "3600000"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://esibuy.web.app
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: PASSWORD_RESET_URL
        value: https://esibuy.web.app/reset-password?token=
