spring.application.name=esiBuy
spring.profiles.default=dev
spring.mongodb.uri=${MONGODB_URI}

#spring.config.import=optional:file:.env[.properties]
spring.config.import=optional:file:.env[.properties],optional:file:./Back_esiBuy/.env[.properties]

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://esibuy.web.app}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}
app.security.csrf-enabled=${CSRF_ENABLED:false}
app.password-reset-url=${PASSWORD_RESET_URL:http://localhost:4200/reset-password?token=}
server.forward-headers-strategy=framework
server.port=${PORT:8080}

# Enable only after existing duplicate commercial names have been resolved.
#spring.data.mongodb.auto-index-creation=true