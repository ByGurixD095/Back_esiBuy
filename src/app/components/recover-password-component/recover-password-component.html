<app-marco-pagina [volver]="true">
  <h1 class="esi-titulo recuperacion-titulo">Recupera tu contraseña</h1>

  <section class="recuperacion esi-tarjeta">
    <p class="descripcion">
      Introduce tu correo electrónico y te enviaremos un enlace para crear una nueva contraseña.
    </p>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="esi-campo">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        @if (esInvalido()) {
        <small class="esi-ayuda esi-error">Introduce un correo electrónico válido.</small>
        }
      </div>

      @if (mensajeExito()) {
      <p class="esi-alerta esi-alerta--ok" role="status">{{ mensajeExito() }}</p>
      }
      @if (mensajeError()) {
      <p class="esi-alerta esi-alerta--error" role="alert">{{ mensajeError() }}</p>
      }

      <button type="submit" class="esi-boton" [disabled]="form.invalid || enviando()">
        {{ enviando() ? 'Enviando…' : 'Enviar enlace' }}
      </button>
      <a class="enlace-secundario" routerLink="/login">Volver a iniciar sesión</a>
    </form>
  </section>
</app-marco-pagina>
