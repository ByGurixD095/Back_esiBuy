<section class="filters-panel" aria-label="Filtros del catálogo">
  <label class="filter-search">
    <span aria-hidden="true">⌕</span>
    <span class="visually-hidden">Buscar productos</span>
    <input type="search" placeholder="Buscar por nombre o referencia" [value]="busqueda()" (input)="actualizarBusqueda($event)" />
  </label>
  <label class="filter-select">
    <span>Categoría</span>
    <select [value]="categoriaId()" (change)="actualizarCategoria($event)">
      @for (opcion of categorias(); track opcion.id) { <option [value]="opcion.id">{{ opcion.nombre }}</option> }
    </select>
  </label>
  <label class="filter-select">
    <span>Ordenar por</span>
    <select [value]="orden()" (change)="actualizarOrden($event)">
      <option value="relevancia">Relevancia</option>
      <option value="precioAsc">Precio menor</option>
      <option value="precioDesc">Precio mayor</option>
      <option value="descuento">Mayor descuento</option>
    </select>
  </label>
  @if (mostrarEstado()) {
    <label class="filter-select">
      <span>Estado</span>
      <select [value]="estado()" (change)="actualizarEstado($event)">
        <option value="todos">Ver todos</option>
        <option value="activos">Ver disponibles</option>
        <option value="inactivos">Ver ocultos</option>
      </select>
    </label>
  }
  <fieldset class="price-filter">
    <legend>Precio</legend>
    <div class="price-range" [style.--price-min]="precioMinimoSlider() + 'c'" [style.--price-max]="precioMaximoSlider() + 'c'" [style.--price-scale]="precioEscalaMaxima() + 'c'">
      <input class="range-input range-min" type="range" min="0" [max]="precioEscalaMaxima()" step="1" [value]="precioMinimoSlider()" aria-label="Precio mínimo" (input)="actualizarPrecioMinimo($event)" />
      <input class="range-input range-max" type="range" min="0" [max]="precioEscalaMaxima()" step="1" [value]="precioMaximoSlider()" aria-label="Precio máximo" (input)="actualizarPrecioMaximo($event)" />
    </div>
    <div class="price-inputs">
      <label>Desde (€)<input type="number" min="0" step="0.01" inputmode="decimal" [value]="precioMinimo() === null ? '' : precioMinimo()! / 100" placeholder="Sin mínimo" (input)="actualizarPrecioTexto($event, 'minimo')" /></label>
      <label>Hasta (€)<input type="number" min="0" step="0.01" inputmode="decimal" [value]="precioMaximo() === null ? '' : precioMaximo()! / 100" placeholder="Sin máximo" (input)="actualizarPrecioTexto($event, 'maximo')" /></label>
    </div>
  </fieldset>
  <label class="discount-filter"><input type="checkbox" [checked]="soloConDescuento()" (change)="alternarDescuento($event)" /> Solo ofertas</label>
  <div class="filter-actions">
    <button class="apply-filter" type="button" (click)="aplicarFiltros()">Aplicar filtros</button>
    @if (hayFiltros()) {
      <button class="clear-filter" type="button" (click)="limpiarFiltros()"><span aria-hidden="true">↺</span> Limpiar</button>
    }
  </div>
</section>
