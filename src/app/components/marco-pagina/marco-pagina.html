<header class="catalog-header">
  <a routerLink="/" class="brand" aria-label="EsiBuy, ir al inicio">
    <img src="/assets/images/svg/logo.svg" alt="" />
  </a>

  @if (panel()) {
  <div class="header-context">{{ panel() }}</div>
  }

  <nav class="header-actions" aria-label="Navegación principal">
    <a class="account-link" [class.volver-link]="volver()" routerLink="/">Inicio</a>
    <a class="account-link" routerLink="/products">Catálogo</a>
    
    @if (estaAutenticado()) {
      @if (tieneRol(['CLIENTE'])) {
        <a
          class="account-link cart-link"
          routerLink="/cart"
          [attr.aria-label]="
            cantidadCestaVisible() === null
              ? 'Mi cesta'
              : 'Mi cesta, ' +
                cantidadCestaVisible() +
                (cantidadCestaVisible() === 1 ? ' producto' : ' productos')
          "
        >
          Mi cesta
          @if (cantidadCestaVisible() !== null) {
            <span class="cart-count">{{ cantidadCestaVisible() }}</span>
          }
        </a>
      }
      <a class="account-link" routerLink="/account">Mi cuenta</a>
      <a class="account-link" routerLink="/manage">Gestionar</a>
    } @else {
      <a class="account-link" routerLink="/login">Iniciar sesión / Registro</a>
    }
  </nav>
</header>

<main class="contenido">
  <ng-content />
</main>

<!-- El pie se mantiene igual, los href="#" externos o anclas sí son correctos -->
<footer class="pie">
  <div class="pie-interior">
    <span>© 2026 EsiBuy · Equipo 5</span>
    <nav aria-label="Información">
      <a href="#">Ayuda</a>
      <a href="#">Privacidad</a>
      <a href="#">Contacto</a>
    </nav>
  </div>
</footer>
