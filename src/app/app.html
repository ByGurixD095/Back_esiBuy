<div class="esibuy-container" (mousemove)="onMouseMove($event)">
  <!-- Canvas 3D Matemático Nativo (partículas de fondo) -->
  <canvas #renderCanvas class="scene-canvas"></canvas>

  <!-- Luces volumétricas integradas con el fondo -->
  <div class="backdrop-glow glow-primary" aria-hidden="true"></div>
  <div class="backdrop-glow glow-warm" aria-hidden="true"></div>

  <!-- Capa principal del logo integrada -->
  <main class="logo-overlay">
    <div class="logo-wrap">
      <div class="brand-lockup">
        <!-- Logotipo completo cargado desde archivo externo -->
        <img class="brand-logo" src="/assets/images/svg/logo.svg" alt="esibuy">
      </div>

      <!-- Eslogan integrado sin contenedor rígido -->
      <div class="slogan-wrapper">
        <p class="brand-slogan">Equipo 5</p>
      </div>
    </div>
  </main>
</div>
