<div class="esibuy-container" (mousemove)="onMouseMove($event)">
  <!-- Canvas 3D Matemático Nativo (partículas de fondo) -->
  <canvas #renderCanvas class="scene-canvas"></canvas>

  <!-- Luces volumétricas integradas con el fondo -->
  <div class="backdrop-glow glow-primary" aria-hidden="true"></div>
  <div class="backdrop-glow glow-warm" aria-hidden="true"></div>

  <!-- Capa principal del logo integrada -->
  <main class="logo-overlay">
    <div class="logo-wrap">
      <div class="brand-lockup">
        <h1 class="brand-title">
          <span class="title-main">esi</span><span class="title-accent">buy</span>
        </h1>

        <!-- Sonrisa con gradiente y resplandor continuo hacia el fondo -->
        <svg class="brand-smile" viewBox="0 0 500 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="smileGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FFB03A" />
              <stop offset="100%" stop-color="#FF7A00" />
            </linearGradient>
          </defs>

          <!-- Arco de la sonrisa -->
          <path
            d="M 45 42 C 150 115, 340 118, 442 56 C 447 53, 452 61, 446 66 C 338 134, 140 130, 39 52 C 34 47, 39 37, 45 42 Z"
            fill="url(#smileGradient)" />
          <!-- Flecha con curva de sustentación -->
          <path
            d="M 414 44 C 427 49, 448 52, 464 42 C 459 58, 451 76, 437 90 C 433 94, 439 99, 445 95 C 462 82, 477 56, 479 35 C 480 30, 475 27, 470 29 C 448 36, 427 33, 412 24 C 407 21, 403 27, 407 32 C 409 36, 412 40, 414 44 Z"
            fill="url(#smileGradient)" />
        </svg>
      </div>

      <!-- Eslogan integrado sin contenedor rígido -->
      <div class="slogan-wrapper">
        <p class="brand-slogan">Equipo 5</p>
      </div>
    </div>
  </main>
</div>
